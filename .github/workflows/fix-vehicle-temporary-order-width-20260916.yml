name: Fix vehicle temporary order and table width 20260916

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-vehicle-temporary-order-width-20260916.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Patch vehicle temporary table
        run: python .github/scripts/fix_vehicle_temporary_order_and_width_20260916.py
      - name: Install dependencies
        run: npm ci
      - name: Rebuild static assets
        run: npm run build:assets
      - name: Run regression tests
        run: npm test
      - name: Commit and push
        run: |
          git config user.name 'BAMCO Fix Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add assets/js/vehicles.js assets/js/bamco.bundle.js index.html version.json
          git commit -m 'Fix temporary handover order and trailing table gap'
          git push
