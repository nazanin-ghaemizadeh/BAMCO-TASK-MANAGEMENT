name: Fix vehicle temporary order and table width 20260916

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-vehicle-temporary-order-width-20260916.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Patch vehicle temporary table
        run: python .github/scripts/fix_vehicle_temporary_order_and_width_20260916.py
      - name: Install dependencies
        run: npm ci
      - name: Rebuild static assets
        run: npm run build:assets
      - name: Verify vehicle patch and focused regressions
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const src = fs.readFileSync('assets/js/vehicles.js', 'utf8');
          const bundle = fs.readFileSync('assets/js/bamco.bundle.js', 'utf8');
          const checks = [
            "return scope==='vehicleTemporary'?rows.reverse():rows",
            "table.style.setProperty('width',`${Math.max(total,viewport)}px`,'important')",
            "table.style.setProperty('min-width','0','important')"
          ];
          for (const text of checks) {
            if (!src.includes(text)) throw new Error(`vehicles.js missing: ${text}`);
            if (!bundle.includes(text)) throw new Error(`bundle missing: ${text}`);
          }
          NODE
          node --test --test-force-exit tests/vehicle-access.test.cjs tests/startup-bundle.test.cjs tests/startup-responsiveness.test.cjs tests/site-coherence-20260915.test.cjs
      - name: Commit and push
        run: |
          git config user.name 'BAMCO Fix Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add assets/js/vehicles.js assets/js/bamco.bundle.js index.html version.json
          git commit -m 'Fix temporary handover order and trailing table gap'
          git push
