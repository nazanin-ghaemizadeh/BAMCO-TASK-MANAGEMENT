name: Report and invoice file acceptance

on:
  pull_request:
    branches: [main]
    paths:
      - 'assets/**'
      - 'index.html'
      - 'supabase/**'
      - 'scripts/test-invoice*'
      - 'tests/sql/**'
      - 'tests/storage/**'
      - 'tests/invoice*'
      - 'tests/browser/check_report_invoice_files.py'
      - 'tests/browser/mock-feature-files-api.js'
      - 'tests/browser/mock-api.js'
      - 'tests/browser/mock-messaging-api.js'
      - 'tests/browser/run_smoke.py'
      - '.github/workflows/report-invoice-files-browser.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  isolated-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci
      - run: npm run build:assets && npm run check:assets
      - name: Install pinned browser test dependency
        run: python -m pip install playwright==1.62.0
      - name: Install Chromium with required system libraries
        run: python -m playwright install --with-deps chromium
      - name: Run isolated report and invoice file journeys
        run: python tests/browser/check_report_invoice_files.py
      - name: Save screenshots and acceptance results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: report-invoice-file-acceptance
          path: test-results/report-invoice-files/
          if-no-files-found: warn
          retention-days: 14
  concurrent-database:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: isolated-fixture-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci
      - name: Verify invoice SQL and RLS in isolation
        run: npm run test:invoice-files-db && node scripts/test-invoice-attachment-delete-sql.mjs
      - name: Install pinned PostgreSQL test client
        run: python -m pip install "psycopg[binary]==3.2.10"
      - name: Verify real concurrent PostgreSQL sessions
        env:
          BAMCO_TEST_POSTGRES_URL: postgresql://postgres:isolated-fixture-only@127.0.0.1:5432/postgres
          BAMCO_TEST_POSTGRES_DISPOSABLE: '1'
        run: python scripts/test-invoice-attachments-concurrency.py
  real-storage-api:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CI: 'true'
      BAMCO_TEST_STORAGE_DISPOSABLE: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned official local Supabase CLI
        run: npm ci --prefix tests/storage/cli
      - name: Install pinned isolated database test client
        run: python -m pip install -r tests/storage/requirements.txt
      - name: Verify real local Auth, Storage, REST and upload Edge
        run: python scripts/test-invoice-storage-api.py --cli "$PWD/tests/storage/cli/node_modules/.bin/supabase"
      - name: Remove only the owned temporary test project
        if: always()
        run: python scripts/test-invoice-storage-api.py --cli "$PWD/tests/storage/cli/node_modules/.bin/supabase" --cleanup-only
      - name: Save sanitized Storage acceptance result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: invoice-real-storage-acceptance
          path: test-results/invoice-storage-api/acceptance.json
          if-no-files-found: warn
          retention-days: 14
