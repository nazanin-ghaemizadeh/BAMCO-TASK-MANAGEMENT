name: Live login startup diagnostic

on:
  push:
    branches: [main]
    paths:
      - 'tests/browser/check_live_login_startup.py'
      - '.github/workflows/live-login-diagnostic.yml'
      - 'index.html'
      - 'version.json'
      - 'assets/js/auth-ui.js'
      - 'assets/js/auth-session.js'
      - 'assets/js/app-update.js'
      - 'scripts/build-static-bundles.mjs'

permissions:
  contents: read

jobs:
  live-login:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Chromium
        run: |
          python -m pip install playwright==1.57.0
          python -m playwright install --with-deps chromium
      - name: Inspect the deployed login without signing in
        run: |
          mkdir -p test-results/live-login
          python tests/browser/check_live_login_startup.py 2>&1 | tee test-results/live-login/diagnostic.json
      - name: Upload live login diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: live-login-diagnostic
          path: test-results/live-login/
          retention-days: 7
