name: Runtime safety checks

on:
  push:
    branches: [main]
    paths:
      - 'assets/js/**'
      - 'assets/css/**'
      - 'tests/**'
      - 'scripts/**'
      - 'package*.json'
      - 'index.html'
      - '.github/workflows/runtime-safety.yml'
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install test dependencies
        run: npm ci
      - name: Build canonical bundle from source
        run: npm run build:assets
      - name: JavaScript syntax
        run: |
          for file in assets/js/*.js; do
            node --check "$file"
          done
          node -e "require('postcss').parse(require('fs').readFileSync('assets/css/unified-ui.css','utf8'))"
      - name: Additive navigation assertions
        run: |
          python3 - <<'PY'
          from pathlib import Path
          rt=Path('assets/js/production-runtime.js').read_text(encoding='utf-8')
          page=Path('index.html').read_text(encoding='utf-8')
          bundle=Path('assets/js/bamco.bundle.js').read_text(encoding='utf-8')
          sess=Path('assets/js/session-runtime.js').read_text(encoding='utf-8')
          ui=Path('assets/js/conversations.js').read_text(encoding='utf-8')
          forbidden=["qa('#nav>.nav-group').forEach(x=>x.remove())",'replaceChildren(','.innerHTML=\'\'']
          for x in forbidden:
              assert x not in rt, f'unsafe navigation rebuild found: {x}'
          for view in ['groupChat','directMessages','taskChats','loginActivity','activeSessions','performanceReport','responseReport','requestReport','systemOptions']:
              assert view in rt, f'missing tested view: {view}'
          assert page.count('assets/js/bamco.bundle.js')==1, 'application bundle must load once'
          for script in ["production-runtime.js", "tab-workspace.js", "conversations.js", "session-runtime.js"]:
              assert bundle.count(f'source: assets/js/{script}')==1, f"runtime must be bundled once: {script}"
          assert "navigation-completeness.js" not in page
          assert "[300,900,1800]" not in rt
          assert "setTimeout(()=>{qa('#appView .view')" not in ui
          assert "session-audit" in sess
          assert "30000" in sess and "120000" not in sess
          assert "pagehide" in sess and "keepalive:true" in sess
          assert "device_id" in sess and "BroadcastChannel" in sess
          assert "chat_ensure_task_direct" in ui
          assert "گفت‌وگوی مرتبط با وظیفه" in ui
          assert "تسک" not in ui
          print('runtime safety: PASS')
          PY

      - name: Full regression suite with documented baseline
        run: npm run test:regression
