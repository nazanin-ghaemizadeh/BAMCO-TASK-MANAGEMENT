name: Task row deselect live regression

on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'assets/js/task-bulk-delete-20260912.js'
      - 'assets/js/avatar-final-20260911.js'
      - '.github/workflows/task-row-deselect-live.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  chromium-live:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Wait for deselection fix on Pages
        shell: bash
        run: |
          set -euo pipefail
          BASE='https://nazanin-ghaemizadeh.github.io/BAMCO-TASK-MANAGEMENT/'
          ready=0
          for i in $(seq 1 40); do
            html="$(curl -fsSL --connect-timeout 10 "${BASE}?deselect=${GITHUB_SHA}-${i}" || true)"
            loader="$(curl -fsSL --connect-timeout 10 "${BASE}assets/js/avatar-final-20260911.js?deselect=${GITHUB_SHA}-${i}" || true)"
            bulk="$(curl -fsSL --connect-timeout 10 "${BASE}assets/js/task-bulk-delete-20260912.js?deselect=${GITHUB_SHA}-${i}" || true)"
            if grep -q 'avatar-final-20260911.js?v=' <<<"$html" \
              && grep -q 'task-bulk-delete-20260912.js?v=' <<<"$loader" \
              && grep -Fq 'state.selected[scope]=set.size===1?Number([...set][0]):null' <<<"$bulk"; then
              ready=1; break
            fi
            sleep 10
          done
          test "$ready" = 1
      - name: Install Chromium
        run: |
          python -m pip install playwright==1.57.0
          python -m playwright install --with-deps chromium
      - name: Verify click again deselects in Kanban and archive
        shell: bash
        run: |
          cat > /tmp/check_deselect.py <<'PY'
          import asyncio, json
          from playwright.async_api import async_playwright

          BASE='https://nazanin-ghaemizadeh.github.io/BAMCO-TASK-MANAGEMENT/'

          async def check_scope(page, scope, ids):
              body=f'#{scope}Body'
              delete=f'#{scope}DeleteBtn'
              first, second=ids
              await page.locator(f'{body} tr[data-task-id="{first}"] td:nth-child(2)').dispatch_event('click')
              await page.wait_for_function("([s]) => window.bamcoTaskSelection.count(s)===1", arg=[scope])
              assert await page.locator(f'{body} tr[data-task-id="{first}"]').get_attribute('aria-selected') == 'true'
              await page.locator(f'{body} tr[data-task-id="{first}"] td:nth-child(2)').dispatch_event('click')
              await page.wait_for_function("([s]) => window.bamcoTaskSelection.count(s)===0", arg=[scope])
              assert await page.locator(f'{body} tr[data-task-id="{first}"]').get_attribute('aria-selected') == 'false'
              assert await page.evaluate("([s]) => state.selected[s]===null", [scope])
              assert await page.locator(delete).is_disabled()

              await page.locator(f'{body} tr[data-task-id="{first}"] td:nth-child(2)').dispatch_event('click')
              await page.locator(f'{body} tr[data-task-id="{second}"] td:nth-child(2)').dispatch_event('click')
              await page.wait_for_function("([s]) => window.bamcoTaskSelection.count(s)===2", arg=[scope])
              await page.locator(f'{body} tr[data-task-id="{first}"] td:nth-child(2)').dispatch_event('click')
              await page.wait_for_function("([s]) => window.bamcoTaskSelection.count(s)===1", arg=[scope])
              assert await page.locator(f'{body} tr[data-task-id="{first}"]').get_attribute('aria-selected') == 'false'
              assert await page.locator(f'{body} tr[data-task-id="{second}"]').get_attribute('aria-selected') == 'true'
              await page.locator(f'{body} tr[data-task-id="{second}"] td:nth-child(2)').dispatch_event('click')
              await page.wait_for_function("([s]) => window.bamcoTaskSelection.count(s)===0", arg=[scope])
              assert await page.locator(delete).is_disabled()

          async def main():
              async with async_playwright() as p:
                  browser=await p.chromium.launch()
                  page=await browser.new_page(viewport={'width':1440,'height':900})
                  await page.goto(BASE+'?task-row-deselect-live=1', wait_until='networkidle')
                  await page.wait_for_function("typeof renderTasks==='function' && window.bamcoTaskSelection && window.__bamcoTaskBulkDelete20260912V4===true")
                  await page.evaluate("""() => {
                    state.profile={id:'00000000-0000-0000-0000-000000000001',role:'manager',active:true,full_name:'مدیر'};
                    state.profiles=[state.profile];
                    state.selected={kanban:null,archive:null};
                    state.tasks=[
                      {id:99101,legacy_id:1,title:'کانبان ۱',description:'الف',owner_id:state.profile.id,status:'ثبت شده',priority:'متوسط',start_date:null,done_date:null,due_date:null,reminder_days:0,last_updated_at:null,due_state:'',manager_notes:'',archived:false},
                      {id:99102,legacy_id:2,title:'کانبان ۲',description:'ب',owner_id:state.profile.id,status:'ثبت شده',priority:'متوسط',start_date:null,done_date:null,due_date:null,reminder_days:0,last_updated_at:null,due_state:'',manager_notes:'',archived:false},
                      {id:99201,legacy_id:3,title:'آرشیو ۱',description:'ج',owner_id:state.profile.id,status:'انجام شده',priority:'متوسط',start_date:null,done_date:null,due_date:null,reminder_days:0,last_updated_at:null,due_state:'',manager_notes:'',archived:true,delay_days:0,advance_days:0},
                      {id:99202,legacy_id:4,title:'آرشیو ۲',description:'د',owner_id:state.profile.id,status:'انجام شده',priority:'متوسط',start_date:null,done_date:null,due_date:null,reminder_days:0,last_updated_at:null,due_state:'',manager_notes:'',archived:true,delay_days:0,advance_days:0}
                    ];
                    renderTasks(false);renderTasks(true);
                  }""")
                  await page.wait_for_timeout(200)
                  await check_scope(page,'kanban',(99101,99102))
                  await check_scope(page,'archive',(99201,99202))
                  print(json.dumps({'kanban':'select/deselect passed','archive':'select/deselect passed','status':'passed'},ensure_ascii=False))
                  await browser.close()

          asyncio.run(main())
          PY
          python /tmp/check_deselect.py
