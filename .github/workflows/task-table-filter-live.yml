name: Task table filter live regression

on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'assets/js/app.js'
      - 'assets/js/avatar-final-20260911.js'
      - 'assets/js/task-bulk-delete-20260912.js'
      - '.github/workflows/task-table-filter-live.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  chromium-live:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Wait for repaired Pages source
        shell: bash
        run: |
          set -euo pipefail
          BASE='https://nazanin-ghaemizadeh.github.io/BAMCO-TASK-MANAGEMENT/'
          ready=0
          for i in $(seq 1 40); do
            html="$(curl -fsSL --connect-timeout 10 "${BASE}?filter-repair=${GITHUB_SHA}-${i}" || true)"
            app="$(curl -fsSL --connect-timeout 10 "${BASE}assets/js/app.js?filter-repair=${GITHUB_SHA}-${i}" || true)"
            loader="$(curl -fsSL --connect-timeout 10 "${BASE}assets/js/avatar-final-20260911.js?filter-repair=${GITHUB_SHA}-${i}" || true)"
            if grep -q 'app.js?v=' <<<"$html" \
              && grep -q 'count=archived?15:13' <<<"$app" \
              && ! grep -q 'task-terminal-columns-20260912.js' <<<"$loader"; then
              ready=1; break
            fi
            sleep 10
          done
          test "$ready" = 1
      - name: Install Chromium
        run: |
          python -m pip install playwright==1.57.0
          python -m playwright install --with-deps chromium
      - name: Verify current-task column and both filter rows
        shell: bash
        run: |
          cat > /tmp/check_filters.py <<'PY'
          import asyncio, json, re
          from playwright.async_api import async_playwright

          BASE='https://nazanin-ghaemizadeh.github.io/BAMCO-TASK-MANAGEMENT/'

          def greenish(value):
              m=re.match(r'rgba?\((\d+),\s*(\d+),\s*(\d+)', value or '')
              if not m: return False
              r,g,b=map(int,m.groups())
              return g > r and g > b and g-r >= 15

          async def main():
              async with async_playwright() as p:
                  browser=await p.chromium.launch()
                  page=await browser.new_page(viewport={'width':1440,'height':900})
                  page_errors=[]
                  page.on('pageerror', lambda exc: page_errors.append(str(exc)))
                  await page.goto(BASE+'?task-filter-live=2', wait_until='networkidle')
                  await page.wait_for_function("typeof renderTasks==='function' && window.__bamcoTaskBulkDelete20260912V4===true")
                  await page.wait_for_timeout(300)

                  assert await page.locator('script[src*="task-terminal-columns-20260912.js"]').count() == 0
                  assert await page.locator('#kanbanView thead tr').first.locator('th').count() == 13
                  assert await page.locator('#archiveView thead tr').first.locator('th').count() == 15
                  assert (await page.locator('#kanbanView thead tr').first.locator('th').last.text_content()).strip() == 'توضیحات مدیر'
                  assert (await page.locator('#archiveView thead tr').first.locator('th').last.text_content()).strip() == 'تعجیل'

                  await page.evaluate("""() => {
                    state.profile={id:'00000000-0000-0000-0000-000000000001',role:'manager',active:true,full_name:'مدیر'};
                    state.profiles=[state.profile];
                    state.tasks=[
                      {id:99001,legacy_id:1,title:'فیلتر کانبان',description:'الف',owner_id:state.profile.id,status:'ثبت شده',priority:'متوسط',start_date:null,done_date:null,due_date:null,reminder_days:0,last_updated_at:null,due_state:'',manager_notes:'یادداشت',archived:false,advance_days:9},
                      {id:99002,legacy_id:2,title:'فیلتر آرشیو',description:'ب',owner_id:state.profile.id,status:'انجام شده',priority:'فوری',start_date:null,done_date:null,due_date:null,reminder_days:0,last_updated_at:null,due_state:'',manager_notes:'یادداشت آرشیو',archived:true,delay_days:2,advance_days:4}
                    ];
                    state.selected={kanban:null,archive:null};
                    renderTasks(false);
                    renderTasks(true);
                  }""")
                  await page.wait_for_timeout(250)

                  diag=await page.evaluate("""() => ({
                    kanbanFilterHtml:document.querySelector('#kanbanView .column-filters')?.outerHTML||null,
                    archiveFilterHtml:document.querySelector('#archiveView .column-filters')?.outerHTML||null,
                    kanbanFilterTh:document.querySelectorAll('#kanbanView .column-filters th').length,
                    archiveFilterTh:document.querySelectorAll('#archiveView .column-filters th').length,
                    kanbanFilterSelect:document.querySelectorAll('#kanbanView .column-filters select').length,
                    archiveFilterSelect:document.querySelectorAll('#archiveView .column-filters select').length,
                    kanbanRows:document.querySelectorAll('#kanbanBody tr[data-task-id]').length,
                    archiveRows:document.querySelectorAll('#archiveBody tr[data-task-id]').length,
                    taskSuite:document.querySelector('#kanbanView table')?.className||'',
                    appViewClass:document.querySelector('#appView')?.className||''
                  })""")
                  print('DIAG='+json.dumps(diag,ensure_ascii=False))
                  print('PAGE_ERRORS='+json.dumps(page_errors,ensure_ascii=False))

                  assert diag['kanbanFilterTh'] == 13, diag
                  assert diag['archiveFilterTh'] == 15, diag
                  assert diag['kanbanFilterSelect'] == 13, diag
                  assert diag['archiveFilterSelect'] == 15, diag
                  assert await page.locator('#kanbanBody tr[data-task-id="99001"] td').count() == 13
                  assert await page.locator('#archiveBody tr[data-task-id="99002"] td').count() == 15
                  assert (await page.locator('#kanbanBody tr[data-task-id="99001"] td').last.text_content()).strip() == 'یادداشت'
                  assert (await page.locator('#archiveBody tr[data-task-id="99002"] td').last.text_content()).strip() == '۴'

                  await page.evaluate("() => document.querySelector('#kanbanBody tr[data-task-id=\"99001\"] td:nth-child(2)').dispatchEvent(new MouseEvent('click',{bubbles:true,cancelable:true}))")
                  await page.wait_for_function("() => window.bamcoTaskSelection.count('kanban')===1")
                  bg=await page.locator('#kanbanBody tr[data-task-id="99001"] td').first.evaluate('el=>getComputedStyle(el).backgroundColor')
                  assert greenish(bg), bg
                  assert await page.locator('#kanbanView .column-filters select').count() == 13

                  print(json.dumps({'kanban_columns':13,'archive_columns':15,'kanban_filters':13,'archive_filters':15,'kanban_last':'توضیحات مدیر','archive_last':'تعجیل','row_selection':'green','status':'passed'},ensure_ascii=False))
                  await browser.close()

          asyncio.run(main())
          PY
          python /tmp/check_filters.py
