name: Browser startup regression

on:
  push:
    branches: [main]
    paths: ['assets/**', 'index.html', 'tests/**', 'scripts/**', 'package*.json', '.github/workflows/browser-startup.yml']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  chromium:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install application test dependencies
        run: npm ci
      - name: Build canonical bundles from source
        run: npm run build:assets
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned browser test dependencies
        run: |
          python -m pip install playwright==1.57.0
          python -m playwright install --with-deps chromium
      - name: Verify fixed home-card geometry
        run: python tests/browser/check_post_welcome.py
      - name: Verify browser failure accounting
        run: python tests/browser/test_smoke_wrapper.py
      - name: Exercise existing startup stability on desktop and mobile
        run: python tests/browser/run_smoke_dom.py
      # The complete regression gate runs in the release workflow on every
      # relevant push.  Re-running it after the four Chromium scenarios makes
      # this 12-minute browser job time out without adding coverage.
      - name: Verify generated assets remain reproducible
        run: npm run check:assets
      - name: Upload browser results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-startup-results
          path: test-results/browser/
          retention-days: 7

  access-visibility:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        width: [1365, 390]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci && npm run build:assets && npm run check:assets
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install existing pinned browser test dependencies
        run: |
          python -m pip install playwright==1.57.0
          python -m playwright install --with-deps chromium
      - name: Verify every authorized tab on the isolated shipped UI
        run: |
          mkdir -p test-results/access-visibility
          python tests/browser/check_access_visibility.py --width ${{ matrix.width }} --output test-results/access-visibility/result-${{ matrix.width }}.json
      - name: Upload access visibility results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: access-visibility-${{ matrix.width }}
          path: test-results/access-visibility/
          retention-days: 7

  responsive-home:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, webkit]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci && npm run build:assets && npm run check:assets
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned browser engine
        run: |
          python -m pip install playwright==1.57.0
          python -m playwright install --with-deps ${{ matrix.browser }}
      - name: Verify mobile home bounds and repeated navigation
        run: python tests/browser/check_home_responsive.py --browser ${{ matrix.browser }}
      - name: Verify rendered title centering and touch versus keyboard focus
        run: python tests/browser/check_home_visual_states.py --browser ${{ matrix.browser }}
      - name: Upload responsive home screenshots and geometry
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: home-responsive-${{ matrix.browser }}
          path: |
            test-results/home-responsive/
            test-results/home-visual-states/
          retention-days: 7
