name: Browser startup regression

on:
  push:
    branches: [main]
    paths: ['assets/**', 'index.html', 'tests/**', 'scripts/**', 'package*.json', '.github/workflows/browser-startup.yml']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  chromium:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install application test dependencies
        run: npm ci
      - name: Build canonical bundles from source
        run: npm run build:assets
      - name: Run Node regression suite
        run: npm test
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned browser test dependencies
        run: |
          python -m pip install playwright==1.57.0
          python -m playwright install --with-deps chromium
      - name: Exercise the real page with isolated APIs on desktop and mobile
        run: python tests/browser/run_smoke_dom.py
      - name: Upload browser results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-startup-results
          path: test-results/browser/
          retention-days: 7
