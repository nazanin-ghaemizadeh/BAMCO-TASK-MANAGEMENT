name: Build and verify static application bundles

on:
  push:
    branches: [main]
    paths:
      - 'assets/js/**'
      - 'assets/css/**'
      - 'index.html'
      - 'scripts/build-static-bundles.mjs'
      - 'supabase/functions/send-message-queue/message-renderer.js'
      - 'package-lock.json'
      - '.github/workflows/build-static-bundles.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: npm ci
      - name: Rebuild canonical static assets
        run: |
          npm run build:assets
          npm run check:assets
          node --check assets/js/bamco.bundle.js
      - name: Verify browser startup and login core
        run: |
          python -m pip install playwright==1.57.0
          python -m playwright install --with-deps chromium
          python tests/browser/check_department_entry_stability.py
      - name: Commit generated assets
        run: |
          set -euo pipefail
          git config user.name 'BAMCO Build Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add assets/js/bamco.bundle.js assets/css/bamco.bundle.css index.html supabase/functions/send-message-queue/message-renderer.js
          if git diff --cached --quiet; then
            echo 'Generated assets are already current.'
            exit 0
          fi
          git commit -m 'Build and verify canonical application bundles'
          git push
