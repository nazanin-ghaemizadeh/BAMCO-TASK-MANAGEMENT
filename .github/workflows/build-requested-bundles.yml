name: Build approved release bundles once
on:
  push:
    branches: [feature/reports-invoice-documents-20261003]
    paths: [.github/workflows/build-requested-bundles.yml]
permissions:
  contents: read
jobs:
  build-reviewed-bundles:
    if: github.repository == 'nazanin-ghaemizadeh/BAMCO-TASK-MANAGEMENT' && github.ref == 'refs/heads/feature/reports-invoice-documents-20261003'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Verify exact approved source and workflow-only commit
        shell: bash
        env:
          EXPECTED_SOURCE: 7dd69161eb449b794df01e1f483812e2025aea43
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "$EXPECTED_SOURCE"
          test "$(git diff --name-only "$EXPECTED_SOURCE" HEAD)" = ".github/workflows/build-requested-bundles.yml"
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build:assets && npm run check:assets && npm test
      - name: Verify exact bundle hashes and commit only allowed outputs
        shell: bash
        run: |
          set -euo pipefail
          echo 'c20fbdb0fcbbfe35d6fd02fb1fda2d9810e50676bb3240c3e6ed523a594ba78d  assets/js/bamco.bundle.js' | sha256sum --check
          echo '672be1c4b5a397a45ea0c06927cf48dc9cb76ef71976495c67477873ac8ff84c  assets/css/bamco.bundle.css' | sha256sum --check
          git add -- assets/js/bamco.bundle.js assets/css/bamco.bundle.css
          test "$(git diff --cached --name-only | sort)" = "$(printf '%s\n' assets/css/bamco.bundle.css assets/js/bamco.bundle.js)"
          test "$(git ls-remote origin refs/heads/feature/reports-invoice-documents-20261003 | cut -f1)" = "$GITHUB_SHA"
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m "build: generate verified report and invoice release bundles"
          git push origin HEAD:refs/heads/feature/reports-invoice-documents-20261003
