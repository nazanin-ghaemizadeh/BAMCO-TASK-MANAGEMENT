name: Profile approval entry regression
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/profile-approval-entry-regression.yml'
      - 'assets/**'
      - 'index.html'
      - 'version.json'
      - 'scripts/build-static-bundles.mjs'
      - 'tests/**'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: profile-request-table-regression-${{ github.ref }}
  cancel-in-progress: true
env:
  PYTHONIOENCODING: utf-8
  PYTHONUTF8: '1'
defaults:
  run:
    shell: bash
jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Verify reproducible production assets
        run: npm run check:assets
      - name: Profile request typography and update-notice regressions
        run: |
          mkdir -p test-results/refinement
          set -o pipefail
          node --test --test-force-exit tests/request-font-refinement.test.cjs tests/profile-approval-entry-root.test.cjs tests/startup-stability-20260915.test.cjs tests/profile-report-mobile-regression.test.cjs tests/request-workflow-visibility.test.cjs tests/app-update.test.cjs 2>&1 | tee test-results/refinement/focused.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: request-font-behavior
          path: test-results/refinement/
          retention-days: 7
  browser:
    runs-on: windows-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned browser tools
        run: |
          python -m pip install playwright==1.57.0
          python -m playwright install chromium
      - name: Actual Windows glyphs, entry stability and post-login regression
        run: |
          python tests/browser/check_table_typography.py
          python tests/browser/check_department_entry_stability.py
          python tests/browser/check_post_welcome.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: request-font-browser
          path: |
            test-results/table-typography/
            test-results/post-welcome/
          retention-days: 7
  deployed-release:
    if: >-
      github.event_name == 'workflow_dispatch' || startsWith(github.event.head_commit.message, 'ci: verify tested release')
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - name: Verify Pages serves the tested document and asset bytes
        run: |
          python - <<'PY'
          import hashlib,json,os,re,time,urllib.request
          from pathlib import Path
          base='https://nazanin-ghaemizadeh.github.io/BAMCO-TASK-MANAGEMENT/'
          expected=json.loads(Path('version.json').read_text(encoding='utf-8'))['version']
          out=Path('test-results/deployment');out.mkdir(parents=True,exist_ok=True)
          def get(path,attempt):
              url=base+path+('?' if '?' not in path else '&')+'verify='+os.environ['GITHUB_SHA'][:12]+'-'+str(attempt)
              req=urllib.request.Request(url,headers={'Cache-Control':'no-cache','User-Agent':'BAMCO-release-verification'})
              with urllib.request.urlopen(req,timeout=8) as response:return response.read()
          last='Deployment not yet ready'
          for attempt in range(12):
              try:
                  version=json.loads(get('version.json',attempt))['version']
                  html=get('index.html',attempt).decode('utf-8')
                  match=re.search(r'<meta name="bamco-app-version" content="([^"]+)"',html)
                  assert version==expected and match and match[1]==expected,(version,match[1] if match else None,expected)
                  paths=['assets/js/bamco.bundle.js','assets/css/bamco.bundle.css','assets/js/department-entry.js','assets/js/app-update.js']
                  digests={}
                  for path in paths:
                      actual=hashlib.sha256(get(path+'?v='+expected,attempt)).hexdigest()
                      assert actual==hashlib.sha256(Path(path).read_bytes()).hexdigest(),'Stale deployed asset: '+path
                      digests[path]=actual
                  result={'version':expected,'commit':os.environ['GITHUB_SHA'],'document_version_matches':True,'deployed_assets_match_tested_source':digests}
                  (out/'verified.json').write_text(json.dumps(result,indent=2),encoding='utf-8')
                  print(json.dumps(result,indent=2));break
              except Exception as exc:
                  last=str(exc);print('Waiting for Pages:',last,flush=True)
                  if attempt<11:time.sleep(5)
          else:raise SystemExit('Unable to verify deployed release: '+last)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: verified-deployed-release
          path: test-results/deployment/
          retention-days: 7
