name: Profile approval entry regression
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/profile-approval-entry-regression.yml'
      - 'assets/**'
      - 'index.html'
      - 'version.json'
      - 'scripts/build-static-bundles.mjs'
      - 'tests/**'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: profile-approval-entry-regression-${{ github.ref }}
  cancel-in-progress: true
jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Verify reproducible production assets
        run: npm run check:assets
      - name: Profile request and update notice regression tests
        run: node --test --test-force-exit tests/profile-approval-entry-root.test.cjs tests/startup-stability-20260915.test.cjs tests/profile-report-mobile-regression.test.cjs tests/request-workflow-visibility.test.cjs tests/app-update.test.cjs
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned browser test tools
        run: |
          python -m pip install playwright==1.57.0
          python -m playwright install --with-deps chromium
      - name: Real-browser entry and post-login avatar checks
        run: |
          python tests/browser/check_department_entry_stability.py
          python tests/browser/check_post_welcome.py
      - name: Upload browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: profile-approval-entry-browser
          path: test-results/post-welcome/
          retention-days: 7
