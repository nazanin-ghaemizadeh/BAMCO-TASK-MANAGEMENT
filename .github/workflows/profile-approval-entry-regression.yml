name: Profile approval entry regression
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/profile-approval-entry-regression.yml'
      - 'assets/**'
      - 'index.html'
      - 'version.json'
      - 'scripts/build-static-bundles.mjs'
      - 'tests/**'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: request-font-publication-v2-${{ github.ref }}
  cancel-in-progress: true
env:
  PYTHONIOENCODING: utf-8
  PYTHONUTF8: '1'
defaults:
  run:
    shell: bash
jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Apply canonical refinement
        run: |
          if [ -f scripts/profile-approval-entry/refinement.py ]; then
            python scripts/profile-approval-entry/refinement.py
            cp scripts/profile-approval-entry/refinement-tests.cjs tests/request-font-refinement.test.cjs
            cp scripts/profile-approval-entry/check_table_typography.py tests/browser/check_table_typography.py
          fi
          npm run build:assets
          npm run check:assets
      - name: Focused behavioral checks
        run: |
          mkdir -p test-results/refinement
          set -o pipefail
          node --test --test-force-exit tests/request-font-refinement.test.cjs tests/profile-approval-entry-root.test.cjs tests/startup-stability-20260915.test.cjs tests/profile-report-mobile-regression.test.cjs tests/request-workflow-visibility.test.cjs tests/app-update.test.cjs 2>&1 | tee test-results/refinement/focused.log
      - name: Existing full regression gate
        timeout-minutes: 8
        run: |
          set -euo pipefail
          cp scripts/test-regression-budget.mjs /tmp/regression-budget-original.mjs
          trap 'cp /tmp/regression-budget-original.mjs scripts/test-regression-budget.mjs' EXIT
          python - <<'PY'
          from pathlib import Path
          p=Path('scripts/test-regression-budget.mjs')
          text=p.read_text()
          old="['--test','--test-force-exit','--test-reporter=tap','tests/*.test.cjs']"
          assert old in text
          text=text.replace(old,"['--test','--test-force-exit','--test-concurrency=4','--test-timeout=120000','--test-reporter=tap','tests/*.test.cjs']")
          p.write_text(text)
          PY
          npm run test:regression 2>&1 | tee test-results/refinement/regression.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: request-font-behavior
          path: test-results/refinement/
          retention-days: 7
  browser:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply canonical refinement
        run: |
          if [ -f scripts/profile-approval-entry/refinement.py ]; then
            python scripts/profile-approval-entry/refinement.py
            cp scripts/profile-approval-entry/refinement-tests.cjs tests/request-font-refinement.test.cjs
            cp scripts/profile-approval-entry/check_table_typography.py tests/browser/check_table_typography.py
          fi
          npm run build:assets
          python -m pip install playwright==1.57.0
          python -m playwright install chromium
      - name: Actual Windows table glyphs and post-login regression
        run: |
          python tests/browser/check_table_typography.py
          python tests/browser/check_post_welcome.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: request-font-browser
          path: |
            test-results/table-typography/
            test-results/post-welcome/
          retention-days: 7
  publish:
    needs: [regression, browser]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Publish exactly the validated source with update message
        run: |
          set -euo pipefail
          if [ ! -f scripts/profile-approval-entry/refinement.py ]; then exit 0; fi
          python scripts/profile-approval-entry/refinement.py
          cp scripts/profile-approval-entry/refinement-tests.cjs tests/request-font-refinement.test.cjs
          cp scripts/profile-approval-entry/check_table_typography.py tests/browser/check_table_typography.py
          npm run build:assets
          python scripts/profile-approval-entry/refinement.py --release
          npm run check:assets
          git fetch origin main
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)"
          git config user.name 'BAMCO Release Bot'
          git config user.email 'actions@users.noreply.github.com'
          rm -rf scripts/profile-approval-entry
          git add -u
          git add tests/request-font-refinement.test.cjs tests/browser/check_table_typography.py
          git commit -m 'fix: descending request row labels and Times New Roman across all tables'
          git push origin HEAD:main
          mkdir -p test-results/publication
          git rev-parse HEAD > test-results/publication/commit.txt
          cp version.json test-results/publication/version.json
      - uses: actions/upload-artifact@v4
        with:
          name: request-font-publication
          path: test-results/publication/
          retention-days: 7
