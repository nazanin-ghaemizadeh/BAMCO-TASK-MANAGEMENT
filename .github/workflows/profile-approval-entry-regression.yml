name: Profile approval entry regression
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/profile-approval-entry-regression.yml'
      - 'scripts/profile-approval-entry/apply.py'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Archive validation inputs
        run: tar --exclude=.git --exclude='*.tar.gz' -czf /tmp/bamco-validation.tar.gz .
      - uses: actions/upload-artifact@v4
        with:
          name: bamco-validation
          path: /tmp/bamco-validation.tar.gz
          retention-days: 1
      - name: Apply staged source edits
        run: |
          if [ -f scripts/profile-approval-entry/apply.py ]; then
            python scripts/profile-approval-entry/apply.py
            npm run build:assets
            node --test --test-force-exit tests/profile-approval-entry-root.test.cjs
            npm run test:regression
          else
            npm run check:assets
          fi
