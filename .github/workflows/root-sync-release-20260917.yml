name: Updater V2 root wiring
on:
  push:
    paths:
      - '.github/workflows/root-sync-release-20260917.yml'
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Wire self-healing updater
        run: |
          python - <<'PY'
          import json,re
          from pathlib import Path
          release=json.loads(Path('version.json').read_text(encoding='utf-8'))['version']
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          s=re.sub(r'\s*<script id="bamcoUpdateRecoveryBootstrap">.*?</script>\s*','\n',s,flags=re.S)
          bootstrap='''  <script id="bamcoUpdateRecoveryBootstrap">\n  (()=>{try{\n    for(const key of ['bamco.app.pending-version','bamco.app.update-attempts','bamco.app.dismissed-version'])localStorage.removeItem(key);\n    document.querySelectorAll('.bamco-update-notice').forEach(node=>node.remove());\n    const url=new URL(location.href);let changed=false;\n    for(const key of ['bamco_update','bamco_reload','bamco_probe','bamco_v'])if(url.searchParams.has(key)){url.searchParams.delete(key);changed=true}\n    if(changed)history.replaceState(history.state,'',url.pathname+(url.search?url.search:'')+url.hash);\n  }catch{}})();\n  </script>\n'''
          tag=f'  <script defer src="assets/js/app-update-v2.js?v={release}"></script>\n'
          pattern=r'\s*<script defer src="assets/js/app-update(?:-v2)?\.js\?v=[^"]+"></script>\s*'
          s,n=re.subn(pattern,'\n'+bootstrap+tag,s,count=1)
          if n!=1: raise SystemExit('updater tag not found')
          s=re.sub(r'(assets/js/root-sync-hotfix-20260917\.js\?v=)[^"&]+',rf'\g<1>{release}',s,count=1)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Verify updater wiring
        run: |
          grep -q 'id="bamcoUpdateRecoveryBootstrap"' index.html
          grep -q 'assets/js/app-update-v2.js?v=' index.html
          ! grep -q 'assets/js/app-update.js?v=' index.html
          grep -q 'bamco.app.pending-version' index.html
      - name: Commit repair and remove temporary workflow
        run: |
          git config user.name 'BAMCO Release Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add index.html
          git rm .github/workflows/root-sync-release-20260917.yml
          git commit -m 'Wire self-healing updater V2 and remove temporary repair workflow'
          git push origin HEAD:main
