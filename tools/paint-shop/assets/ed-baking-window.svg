<text x="83" y="811" font-size="26">(15, 165)</text><text x="83" y="858" font-size="26">(15, 200)</text><text x="83" y="905" font-size="26">(22, 200)</text><text x="83" y="952" font-size="26">(35.5, 172)</text><text x="83" y="999" font-size="26">(35.5, 165)</text>
<text x="286" y="757" font-weight="bold" font-size="27">Upper Boundary Equation</text>
