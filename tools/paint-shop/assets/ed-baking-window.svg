<text x="584" y="999" font-size="23">15 ≤ t ≤ 35.5</text>
<text x="917" y="775" font-size="25" font-weight="bold">Complete Baking Window</text>
<text x="925" y="820" font-size="27">15 ≤ t ≤ 35.5</text>
<text x="925" y="863" font-size="27">165 ≤ T ≤ Tmax(t)</text>
<text x="925" y="908" font-size="24">Tmax(t) = 200,  15 ≤ t ≤ 22</text>
<text x="925" y="953" font-size="22">Tmax(t) = 200 − (28/13.5)(t − 22)</text>
<text x="1141" y="997" font-size="22">22 &lt; t ≤ 35.5</text>
