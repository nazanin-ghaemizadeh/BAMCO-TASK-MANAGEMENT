<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>بازیابی BAMCO</title>
<style>
html,body{margin:0;min-height:100%;background:#f4f8f5;color:#164d3b;font-family:Tahoma,sans-serif}main{min-height:100vh;display:grid;place-items:center;padding:24px;box-sizing:border-box}.card{width:min(520px,100%);background:#fff;border:1px solid #c7d9d0;border-radius:18px;padding:26px;box-shadow:0 12px 36px rgba(24,67,52,.12);text-align:center}.spinner{width:34px;height:34px;border:4px solid #d9e9e1;border-top-color:#176b4d;border-radius:50%;margin:0 auto 18px;animation:r .8s linear infinite}@keyframes r{to{transform:rotate(360deg)}}h1{font-size:22px;margin:0 0 8px}p{font-size:16px;line-height:1.8;margin:0;color:#5b7268}
</style>
</head>
<body><main><section class="card"><div class="spinner" aria-hidden="true"></div><h1>در حال بازیابی نسخه جدید سامانه</h1><p id="status">اطلاعات کاری و حساب شما حذف نمی‌شود.</p></section></main>
<script>
(async()=>{
 const status=document.getElementById('status');
 try{
  for(const key of ['bamco.app.pending-version','bamco.app.update-attempts','bamco.app.dismissed-version','bamco.app.installed-version'])localStorage.removeItem(key);
  for(const key of Object.keys(sessionStorage))if(/^bamco\.update\./.test(key))sessionStorage.removeItem(key);
  if('serviceWorker' in navigator){
   const regs=await navigator.serviceWorker.getRegistrations().catch(()=>[]);
   await Promise.all(regs.filter(r=>{const u=r.active?.scriptURL||r.waiting?.scriptURL||r.installing?.scriptURL||'';return u&&!new URL(u,location.href).pathname.endsWith('/push-sw.js')}).map(r=>r.unregister().catch(()=>false)));
  }
  if('caches' in window){
   const names=await caches.keys().catch(()=>[]);
   await Promise.all(names.filter(n=>/bamco/i.test(n)&&!/sticker/i.test(n)).map(n=>caches.delete(n).catch(()=>false)));
  }
  const vurl=new URL('version.json',location.href);vurl.searchParams.set('recover',String(Date.now()));
  const response=await fetch(vurl.href,{cache:'no-store',headers:{Accept:'application/json'}});
  const version=response.ok?String((await response.json())?.version||'').trim():'';
  const target=new URL('./',location.href);
  target.searchParams.set('bamco_recovered',version||'latest');
  target.searchParams.set('t',String(Date.now()));
  status.textContent='نسخه تازه دریافت شد؛ در حال ورود به سامانه…';
  location.replace(target.href);
 }catch(error){
  status.textContent='بازیابی خودکار کامل نشد. صفحه را یک‌بار تازه‌سازی کنید.';
 }
})();
</script>
</body></html>
